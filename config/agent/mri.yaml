_target_: agent.AgentConfig

upsampler:
  _target_: models.diffusion.DenoiserConfig
  sigma_data: 0.5
  sigma_offset_noise: 0.1
  noise_previous_obs: false
  upsampling_factor: 2
  inner_model:
    _target_: models.diffusion.InnerModelConfig
    img_channels: 1
    num_steps_conditioning: 1  # LR slices before the target
    num_next_slices_conditioning: 0  # LR slices after the target (1 here and above = both neighbours)
    cond_channels: 2048
    depths:
    - 2
    - 2
    - 2
    - 2
    channels:
    - 64
    - 64
    - 128
    - 256
    attn_depths:
    - 0
    - 0
    - 0
    - 1
