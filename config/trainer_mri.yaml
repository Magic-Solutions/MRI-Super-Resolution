defaults:
  - _self_
  - env: mri
  - agent: mri

hydra:
  job:
    chdir: True

wandb:
  mode: online
  project: mri-super-resolution
  entity: null
  name: null
  group: null
  tags: null
  notes: null
  heartbeat_interval_seconds: 60

initialization:
  path_to_ckpt: null

common:
  devices: 0
  seed: null
  resume: False

checkpointing:
  save_agent_every: 5
  num_to_keep: 11

training:
  should: True
  num_final_epochs: 600  # number of the last epoch
  first_epoch: 1  # > 1 to continue a finished run from initialization.path_to_ckpt
  early_stop_patience: 0  # stop after this many epochs without a new best val PSNR (0: off)
  cache_in_ram: False
  num_workers_data_loaders: 4
  debug_step_logs: False
  debug_log_every_n_steps: 10

evaluation:
  should: True
  every: 1  # low_res/test holds the validation split
  max_test_batches: null
  val_sr_every: 1  # sampled PSNR/SSIM on fixed validation slices; picks agent_best_val.pt (0: off)
  val_sr_slices_per_volume: 16
  val_sr_num_steps: 20  # shared EDM sampler, Euler, as in the 3D validation
  val_seed: 0
  num_inference_samples: 3
  num_inference_steps: 20

upsampler:
  training:
    num_autoregressive_steps: 1
    start_after_epochs: 0
    steps_first_epoch: 400
    steps_per_epoch: 400
    sample_weights: null
    batch_size: 4  # 8 runs out of memory on one L4; 4 x 8 is what the March runs and the paper used
    grad_acc_steps: 8
    lr_warmup_steps: 100
    max_grad_norm: 10.0

  optimizer:
    lr: 1e-4
    weight_decay: 1e-2
    eps: 1e-8

  sigma_distribution:
    _target_: models.diffusion.SigmaDistributionConfig
    loc: -1.2
    scale: 1.2
    sigma_min: 2e-3
    sigma_max: 20

# 2.5D upsampler sampling (EDM stochastic sampler). Eval scripts override num_steps_denoising.
sampler:
  _target_: models.diffusion.DiffusionSamplerConfig
  num_steps_denoising: 1
  sigma_min: 1
  sigma_max: 5.0
  rho: 7
  order: 2  # 1: Euler, 2: Heun
  s_churn: 10.0  # Amount of stochasticity
  s_tmin: 1
  s_tmax: 5
  s_noise: 0.9
  s_cond: 0
